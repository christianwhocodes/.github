[project.urls]
Homepage = "https://christianwhocodes.space/"
Repository = "https://github.com/kvnwaks/.github"

[project]
name = "app-kvnwaks"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["tawala[vercel,psycopg]>=1.3.3"]

[dependency-groups]
dev = ["djlint>=1.36.4", "ruff>=0.15.9", "ty>=0.0.28"]

[tool.djlint]
blank_line_before_tag = "block,if,for"
blank_line_after_tag = "endblock,endif,endfor"

[tool.tawala]
allowed-hosts = [
    "christianwhocodes.space",
    "www.christianwhocodes.space",
    "localhost",
    "127.0.0.1",
    ".vercel.app",
]
server = { use-asgi = true }
internationalization = { timezone = "Africa/Nairobi" }
db = { backend = "postgresql", use-vars = true, sslmode = "require" }
storage = { backend = "vercelblob" }
